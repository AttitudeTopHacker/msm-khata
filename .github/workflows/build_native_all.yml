name: Build Native Releases (.exe, .deb, .apk)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Procfile'
      - 'render.yaml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Procfile'
      - 'render.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. LINUX NATIVE DEBIAN (.deb) PACKAGE
  # =========================================================================
  build-linux-deb:
    name: 🐧 Build Linux Native (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            dpkg-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop & Check Environment
        run: |
          flutter config --enable-linux-desktop
          flutter doctor -v

      - name: Build Flutter Linux Release
        run: |
          cd msmkhata_app
          flutter pub get
          flutter build linux --release --obfuscate --split-debug-info=symbols

      - name: Package into Debian (.deb)
        run: |
          PKG_NAME="msmkhata"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep 'version:' msmkhata_app/pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          fi
          ARCH="amd64"
          DEB_ROOT="dist/deb/${PKG_NAME}_${VERSION}_${ARCH}"

          echo "==> Creating Debian package layout at ${DEB_ROOT} for version ${VERSION}..."
          mkdir -p "${DEB_ROOT}/DEBIAN"
          mkdir -p "${DEB_ROOT}/opt/${PKG_NAME}"
          mkdir -p "${DEB_ROOT}/usr/bin"
          mkdir -p "${DEB_ROOT}/usr/share/applications"
          mkdir -p "${DEB_ROOT}/usr/share/pixmaps"
          mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps"

          echo "==> Copying Flutter release bundle..."
          cp -r msmkhata_app/build/linux/x64/release/bundle/* "${DEB_ROOT}/opt/${PKG_NAME}/"
          chmod +x "${DEB_ROOT}/opt/${PKG_NAME}/msmkhata_app"

          echo "==> Creating /usr/bin/msmkhata launcher..."
          cat << 'EOF' > "${DEB_ROOT}/usr/bin/msmkhata"
          #!/usr/bin/env bash
          exec /opt/msmkhata/msmkhata_app "$@"
          EOF
          chmod 755 "${DEB_ROOT}/usr/bin/msmkhata"

          echo "==> Creating desktop entry..."
          cat << 'EOF' > "${DEB_ROOT}/usr/share/applications/msmkhata.desktop"
          [Desktop Entry]
          Name=MsmKhata
          GenericName=Financial Ledger
          Comment=Personal Financial Ledger & Tracker by msm.movin
          Exec=/usr/bin/msmkhata %u
          Icon=msmkhata
          Terminal=false
          Type=Application
          Categories=Finance;Office;Utility;
          Keywords=ledger;finance;money;khata;accounting;
          StartupWMClass=com.msmmovin.msmkhata_app
          MimeType=x-scheme-handler/io.supabase.msmkhata;
          EOF
          chmod 644 "${DEB_ROOT}/usr/share/applications/msmkhata.desktop"

          echo "==> Copying scalable SVG & PNG pixmap icons..."
          if [ -f "assets/icon.svg" ]; then
            cp "assets/icon.svg" "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps/msmkhata.svg"
            cp "assets/icon.svg" "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps/com.msmmovin.msmkhata_app.svg"
            chmod 644 "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps/msmkhata.svg"
            chmod 644 "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps/com.msmmovin.msmkhata_app.svg"
          fi
          if [ -f "assets/icon.png" ]; then
            cp "assets/icon.png" "${DEB_ROOT}/usr/share/pixmaps/msmkhata.png"
            cp "assets/icon.png" "${DEB_ROOT}/usr/share/pixmaps/com.msmmovin.msmkhata_app.png"
            cp "assets/icon.png" "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/msmkhata.png"
            cp "assets/icon.png" "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/com.msmmovin.msmkhata_app.png"
            chmod 644 "${DEB_ROOT}/usr/share/pixmaps/msmkhata.png"
            chmod 644 "${DEB_ROOT}/usr/share/pixmaps/com.msmmovin.msmkhata_app.png"
            chmod 644 "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/msmkhata.png"
            chmod 644 "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/com.msmmovin.msmkhata_app.png"
          fi

          echo "==> Creating DEBIAN/prerm hook..."
          cat << 'EOF' > "${DEB_ROOT}/DEBIAN/prerm"
          #!/bin/sh
          set -e
          pkill -f "msmkhata" 2>/dev/null || true
          exit 0
          EOF
          chmod 755 "${DEB_ROOT}/DEBIAN/prerm"

          echo "==> Creating DEBIAN/postinst hook..."
          cat << 'EOF' > "${DEB_ROOT}/DEBIAN/postinst"
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f -t /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications || true
          fi
          exit 0
          EOF
          chmod 755 "${DEB_ROOT}/DEBIAN/postinst"

          echo "==> Creating DEBIAN/postrm hook (cleans user session on purge)..."
          cat << 'EOF' > "${DEB_ROOT}/DEBIAN/postrm"
          #!/bin/sh
          set -e
          case "$1" in
            purge)
              rm -rf /opt/msmkhata 2>/dev/null || true
              for udir in /home/*; do
                if [ -d "$udir" ]; then
                  rm -rf "$udir/.local/share/com.msmmovin.msmkhata_app" 2>/dev/null || true
                  rm -rf "$udir/.local/share/msmkhata" 2>/dev/null || true
                  rm -rf "$udir/.local/share/msmkhata_app" 2>/dev/null || true
                  rm -rf "$udir/.cache/msmkhata" 2>/dev/null || true
                  rm -rf "$udir/.cache/msmkhata_app" 2>/dev/null || true
                  rm -rf "$udir/.config/msmkhata" 2>/dev/null || true
                fi
              done
              ;;
            remove|upgrade|failed-upgrade|abort-install|abort-upgrade|disappear)
              ;;
          esac
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f -t /usr/share/icons/hicolor 2>/dev/null || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 "${DEB_ROOT}/DEBIAN/postrm"

          echo "==> Generating DEBIAN/control file..."
          INSTALLED_SIZE=$(du -sk "${DEB_ROOT}" | cut -f1)
          cat << EOF > "${DEB_ROOT}/DEBIAN/control"
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: AttitudeTopHacker <msm.movin@gmail.com>
          Depends: libc6, libgtk-3-0, libglib2.0-0
          Description: MsmKhata - Native Financial Ledger & Tracker
           Native cross-platform financial ledger and tracker desktop application
           built with Flutter and Supabase, maintained by msm.movin (Est. 2022).
          EOF

          echo "==> Building .deb package..."
          OUTPUT_DEB="${PKG_NAME}_${VERSION}_linux_${ARCH}.deb"
          dpkg-deb --build --root-owner-group "${DEB_ROOT}" "${OUTPUT_DEB}"
          ls -lh "${OUTPUT_DEB}"

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: msmkhata_*_linux_amd64.deb
          retention-days: 14

  # =========================================================================
  # 2. WINDOWS NATIVE (.exe) BUNDLE & ZIP
  # =========================================================================
  build-windows-exe:
    name: 🪟 Build Windows Native (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Check Environment
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Build Flutter Windows Release
        run: |
          cd msmkhata_app
          flutter pub get
          flutter build windows --release --obfuscate --split-debug-info=symbols

      - name: Package Windows Release ZIP & Executable
        shell: pwsh
        run: |
          $ReleaseDir = "msmkhata_app/build/windows/x64/runner/Release"
          if (-not (Test-Path $ReleaseDir)) {
            $ReleaseDir = "msmkhata_app/build/windows/runner/Release"
          }
          if (-not (Test-Path $ReleaseDir)) {
            $Found = Get-ChildItem -Path "msmkhata_app/build/windows" -Recurse -Filter "msmkhata_app.exe" | Select-Object -First 1
            if ($Found) { $ReleaseDir = $Found.DirectoryName }
          }
          Write-Host "==> Target Windows Release directory: $ReleaseDir"
          $Version = (Select-String -Path "msmkhata_app/pubspec.yaml" -Pattern "version:\s*([^\+]+)").Matches.Groups[1].Value.Trim()
          if ($env:GITHUB_REF_NAME -match "^v(.+)$") {
            $Version = $Matches[1]
          }
          $ZipName = "msmkhata_${Version}_windows_x64.zip"
          $ExeName = "msmkhata_${Version}_windows.exe"
          Write-Host "==> Compressing Windows release bundle into $ZipName..."
          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath $ZipName -Force
          Write-Host "==> Copying standalone executable to $ExeName..."
          Copy-Item -Path "$ReleaseDir/msmkhata_app.exe" -Destination $ExeName
          Get-Item $ZipName, $ExeName | Format-Table Name, Length, LastWriteTime

      - name: Upload Windows Bundle ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-zip
          path: msmkhata_*_windows_x64.zip
          retention-days: 14

      - name: Upload Windows Standalone .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-exe
          path: msmkhata_*_windows.exe
          retention-days: 14

  # =========================================================================
  # 3. ANDROID NATIVE RELEASE (.apk)
  # =========================================================================
  build-android-apk:
    name: 📱 Build Android Release (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Setup Android Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "==> Restoring Android release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > msmkhata_app/android/app/upload-keystore.jks
          fi
          if [ -f "msmkhata_app/android/app/upload-keystore.jks" ]; then
            echo "==> Android release signing keystore is present and verified."
            ls -lh msmkhata_app/android/app/upload-keystore.jks
          fi

      - name: Build Flutter Android APK Release
        run: |
          cd msmkhata_app
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=symbols

      - name: Prepare APK Package
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep 'version:' msmkhata_app/pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          fi
          cp msmkhata_app/build/app/outputs/flutter-apk/app-release.apk "msmkhata_${VERSION}_android.apk"
          ls -lh "msmkhata_${VERSION}_android.apk"

      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: msmkhata_*_android.apk
          retention-days: 14

  # =========================================================================
  # 4. AUTOMATIC GITHUB RELEASE PUBLISHER
  # =========================================================================
  publish-release:
    name: 🚀 Publish Official GitHub Release
    needs: [build-linux-deb, build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Inspect Release Artifacts
        run: |
          echo "Downloaded assets for release:"
          ls -la release-binaries

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.7' }}
          name: "MsmKhata ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.7' }} — Native Release (.exe, .deb, .apk)"
          body: |
            ## 🚀 MsmKhata Native Cross-Platform Release

            Pure Native Cross-Platform Build powered by Flutter and GitHub Actions (0% local compilation load).

            ### 📦 Packages Included:
            - 🐧 **Linux (.deb)**: Native Debian package with desktop integration & custom taskbar icon
            - 🪟 **Windows (.exe / .zip)**: Portable Windows bundle and standalone executable with custom branding
            - 📱 **Android (.apk)**: Release APK signed with permanent upload-keystore & native Google Play Services

            ---
            *Built and maintained by AttitudeTopHacker (msm.movin, Est. 2022)*
          files: release-binaries/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

