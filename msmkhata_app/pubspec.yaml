publish_to: 'none'
version: 1.0.9+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Network & Backend
  http: ^1.2.0
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3

  # UI, Icons & Formatting
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  fl_chart: ^0.68.0
